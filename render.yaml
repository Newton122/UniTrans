services:
  - type: web
    name: unitrans-backend
    env: python
    plan: starter
    region: oregon
    buildCommand: pip install -r backend-api/requirements.txt
    startCommand: cd backend-api && python manage.py migrate && gunicorn unitrans.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SECRET_KEY
        value: "django-insecure-change-me-in-production"
      - key: DATABASE_URL
        fromDatabase: unitrans-db
      - key: CORS_ALLOWED_ORIGINS
        value: "https://unitrans.onrender.com,https://frontend-driver.onrender.com,https://frontend-manager.onrender.com,https://frontend-student.onrender.com"

  - type: web
    name: frontend-driver
    env: node
    plan: starter
    region: oregon
    buildCommand: cd frontend-driver && npm install
    startCommand: cd frontend-driver && npm install && npm run build && npx next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: "https://unitrans.onrender.com"

  - type: web
    name: frontend-manager
    env: node
    plan: starter
    region: oregon
    buildCommand: cd frontend-manager && npm install
    startCommand: cd frontend-manager && npm install && npm run build && npx next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: "https://unitrans.onrender.com"

  - type: web
    name: frontend-student
    env: node
    plan: starter
    region: oregon
    buildCommand: cd frontend-student && npm install
    startCommand: cd frontend-student && npm install && npm run build && npx next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: "https://unitrans.onrender.com"

databases:
  - name: unitrans-db
    engine: postgresql
    version: "15"
    plan: starter
